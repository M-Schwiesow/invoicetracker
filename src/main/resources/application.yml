spring:
    application:
        name: invoicetracker
    datasource:
        url: jdbc:postgresql://localhost:5432/invoice_tracker
        password: postgres #oof this needs an external config store
        username: postgres #same
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        generate-ddl: true
        show-sql: true # remove in future
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                globally_quoted_identifiers: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
    sql:
        init:
            mode: never