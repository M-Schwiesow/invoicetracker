info:
  name: Login
  type: http
  seq: 2

http:
  method: post
  url: "{{baseUrl}}/user/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{user_email}}",
        "password": "{{user_password}}"
      }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
